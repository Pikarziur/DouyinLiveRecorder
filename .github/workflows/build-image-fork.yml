name: Build fork multi-arch image

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'image tag'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write      # 推 ghcr.io 必需；同时需在 fork Settings→Actions→General 把 Workflow permissions 设为 Read and write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          tags: |
            ghcr.io/pikarziur/douyinliverecorder:${{ github.event.inputs.tag_name || 'latest' }}
            ghcr.io/pikarziur/douyinliverecorder:latest
